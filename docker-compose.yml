services:
  app1:
    build: ./app
    ports:
      - "127.0.0.1:5001:5000"
    restart: unless-stopped

  app2:
    build: ./app
    ports:
      - "127.0.0.1:5002:5000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
    restart: unless-stopped
